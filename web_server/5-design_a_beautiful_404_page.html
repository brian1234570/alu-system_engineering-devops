<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - Ceci n'est pas une page</title>
<style>
  :root {
    --wall: #4a1d2a;
    --wall-deep: #331320;
    --brass: #c8a45a;
    --brass-dark: #8f7233;
    --placard: #ece4d3;
    --ink: #221a16;
    --canvas: #f3eee3;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    color: var(--ink);
    background:
      radial-gradient(ellipse at 50% 18%, rgba(255, 236, 200, 0.22), transparent 60%),
      linear-gradient(var(--wall), var(--wall-deep));
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main {
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* The frame: hangs slightly crooked, straightens when pressed */
  .frame-button {
    appearance: none;
    border: 0;
    background: none;
    padding: 0;
    cursor: pointer;
    transform: rotate(-3deg);
    transform-origin: 50% 0;
    transition: transform 0.9s cubic-bezier(.3, 1.6, .5, 1);
  }
  .frame-button[aria-pressed="true"] { transform: rotate(0deg); }
  .frame-button:focus-visible { outline: 3px solid var(--placard); outline-offset: 8px; }

  .frame {
    width: min(78vw, 340px);
    aspect-ratio: 4 / 5;
    padding: 18px;
    background: linear-gradient(135deg, #e3c883, var(--brass) 40%, var(--brass-dark));
    box-shadow: 0 26px 40px rgba(0, 0, 0, 0.45), inset 0 0 0 2px rgba(255, 255, 255, 0.25);
    display: block;
  }
  .canvas {
    width: 100%;
    height: 100%;
    background: var(--canvas);
    box-shadow: inset 0 6px 16px rgba(0, 0, 0, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .canvas span {
    font-size: clamp(72px, 22vw, 120px);
    font-style: italic;
    letter-spacing: -0.04em;
    color: rgba(34, 26, 22, 0.12);
  }

  .placard {
    margin-top: 36px;
    width: 100%;
    background: var(--placard);
    padding: 22px 26px 24px;
    border-left: 5px solid var(--brass);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
  }
  h1 {
    margin: 0;
    font-size: clamp(1.5rem, 5vw, 1.9rem);
    font-style: italic;
    font-weight: 600;
    line-height: 1.2;
  }
  .medium { margin: 4px 0 14px; font-size: 0.95rem; opacity: 0.7; }
  p { margin: 0 0 18px; line-height: 1.65; max-width: 46ch; }
  a.home {
    display: inline-block;
    padding: 10px 18px;
    background: var(--ink);
    color: var(--placard);
    text-decoration: none;
    font-weight: 600;
  }
  a.home:hover { background: var(--wall); }
  a.home:focus-visible { outline: 3px solid var(--brass-dark); outline-offset: 3px; }
  .hint { margin: 16px 0 0; font-size: 0.85rem; opacity: 0.6; }

  @media (prefers-reduced-motion: reduce) {
    .frame-button { transition: none; }
  }
</style>
</head>
<body>
  <main>
    <button class="frame-button" type="button" aria-pressed="false" aria-label="Straighten the frame">
      <span class="frame"><span class="canvas"><span>404</span></span></span>
    </button>

    <section class="placard">
      <h1>Ceci n'est pas une page</h1>
      <div class="medium">Oil on nothing. Error 404, page not found.</div>
      <p>The address you entered doesn't lead to anything on this site. Check the URL for typos, or start again from the home page.</p>
      <a class="home" href="/">Go to the home page</a>
      <p class="hint">The frame is crooked. Click it to straighten it.</p>
    </section>
  </main>

<script>
  var frame = document.querySelector(".frame-button");
  frame.addEventListener("click", function () {
    var pressed = frame.getAttribute("aria-pressed") === "true";
    frame.setAttribute("aria-pressed", pressed ? "false" : "true");
  });
</script>
</body>
</html>
